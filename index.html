<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/src/globals.css" as="style" />
    <link rel="stylesheet" href="/src/globals.css" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme-store");
          const theme = stored ? JSON.parse(stored).state.theme : "system";
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const resolved =
            theme === "system" ? (systemDark ? "dark" : "light") : theme;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (_err) {
          // Fallback to system preference
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const fallback = systemDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", fallback);
          document.documentElement.style.colorScheme = fallback;
        }
      })();
    </script>
    <meta name="theme-color" content="#090E13" />
    <meta name="description" content="Aping | Building" />
    <meta name="author" content="Finisus" />
